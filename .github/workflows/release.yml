name: DataViz Release & Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Package DataViz Portable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Test Suite
        run: |
          python run_tests.py

      - name: Package Portable Distribution
        shell: pwsh
        run: |
          $distDir = "DataViz_Portable_Dist"
          New-Item -ItemType Directory -Force -Path $distDir
          
          # Copy core application files
          Copy-Item -Path "app.py", "requirements.txt", "README.md", "LICENSE" -Destination $distDir
          Copy-Item -Recurse -Path "core", "routes", "services", "static", "templates" -Destination $distDir
          
          # Copy docs if available
          if (Test-Path "docs") {
            Copy-Item -Recurse -Path "docs" -Destination $distDir
          }

          # Ensure uploads directory
          New-Item -ItemType Directory -Force -Path "$distDir/uploads"

          # Copy launcher scripts
          if (Test-Path "Baslat.bat") {
            Copy-Item -Path "Baslat.bat" -Destination $distDir
          }
          if (Test-Path "start.sh") {
            Copy-Item -Path "start.sh" -Destination $distDir
          }

          # Create ZIP archive
          Compress-Archive -Path "$distDir/*" -DestinationPath "DataViz_Portable.zip" -Force
          Write-Host "Archive created: DataViz_Portable.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DataViz_Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
