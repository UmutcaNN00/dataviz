<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnteraktif Veri Analizi</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        
        <aside class="sidebar">
            <h2>📊 Veri Analizi</h2>
            
            <div class="upload-section">
                <label for="fileInput" class="upload-btn">📁 Excel/CSV Yükle</label>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" hidden>
                <div id="uploadStatus" class="status-msg"></div>
            </div>

            <div id="mappingSection" class="mapping-section hidden">
                <hr>
                <h3>Eksen Eşleştirme</h3>
                
                <div class="form-group">
                    <label for="xAxis">X Ekseni (Alt/Yatay)</label>
                    <select id="xAxis">
                        <option value="">-- Seçiniz --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="yAxis">Y Ekseni (Sol/Dikey - Sayısal)</label>
                    <select id="yAxis">
                        <option value="">Yok</option>
                    </select>
                </div>
                
                <div class="form-group" id="aggFuncGroup">
                    <label for="aggFunc">Hesaplama Türü</label>
                    <select id="aggFunc">
                        <option value="sum">Toplam (Sum)</option>
                        <option value="mean">Ortalama (Mean)</option>
                        <option value="count">Say / Adet (Count)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="chartType">Grafik Türü</label>
                    <select id="chartType">
                        <option value="bar">Çubuk Grafik (Bar)</option>
                        <option value="line">Çizgi Grafik (Line)</option>
                        <option value="pie">Pasta Grafik (Pie)</option>
                        <option value="scatter">Dağılım Grafiği (Scatter)</option>
                    </select>
                </div>
                
                <button id="drawChartBtn" class="upload-btn" style="background-color: #27ae60; margin-top: 10px;">
                    🎨 Grafiği Çiz / Güncelle
                </button>
            </div>
            
            <!-- Görünüm ve Özelleştirme -->
            <details class="customization-accordion">
                <summary>🎨 Görünüm ve Özelleştirme</summary>
                <div class="accordion-content">
                    <div class="form-group">
                        <label for="chartColor">Ana Grafik Rengi</label>
                        <input type="color" id="chartColor" value="#3498db">
                    </div>
                    
                    <div class="form-group">
                        <label for="customXTitle">X Ekseni Özel Başlığı</label>
                        <input type="text" id="customXTitle" placeholder="Örn: Satış Ayları">
                    </div>

                    <div class="form-group">
                        <label for="customYTitle">Y Ekseni Özel Başlığı</label>
                        <input type="text" id="customYTitle" placeholder="Örn: Toplam Ciro (₺)">
                    </div>

                    <button id="applyCustomsBtn" class="upload-btn apply-btn">✨ Makyajı Uygula</button>
                </div>
            </details>

            <button id="downloadPngBtn" class="upload-btn download-btn">⬇️ Grafiği İndir (PNG)</button>
        </aside>

        <main class="main-panel">
            <div id="chartArea" class="chart-area">
                <p class="placeholder-text">Analize başlamak için sol panelden bir veri seti yükleyin.</p>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
